services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - frontend
      - paperless-ngx
    environment:
      COMPOSE_PROJECT_NAME: paperless
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_OCR_LANGUAGES: eng
      USERMAP_UID: 3001
      USERMAP_GID: 3007
  # DB access
  # PAPERLESS_DBENGINE: postgresql
  # PAPERLESS_DBHOST: ${DB_HOST}
  # PAPERLESS_DBPORT: ${DB_PORT}
  # PAPERLESS_DBNAME: ${DB_NAME}
  # PAPERLESS_DBUSER: ${DB_USER}
  # PAPERLESS_DBPASS: ${DB_PASS}
  # PAPERLESS_DB_OPTIONS: "sslmode=require"
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - broker
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.paperless-ngx.rule=Host(`paperless-ngx.debian-02.prod.home.sauers.link`) || Host(`docs.home.sauers.link`)
      - traefik.http.routers.paperless-ngx.tls=true
      - traefik.http.routers.paperless-ngx.tls.certresolver=cloudflare
      - traefik.http.routers.paperless-ngx.entrypoints=websecure
      - traefik.http.routers.paperless-ngx.service=paperless-ngx
      - traefik.http.services.paperless-ngx.loadbalancer.server.port=8000
    volumes:
      # store data and media (e.g. thumbnails) in the same folder
      - /mnt/paperless-ngx/data:/usr/src/paperless/data
      - /mnt/paperless-ngx/media:/usr/src/paperless/media
      - /mnt/paperless-ngx/consume:/usr/src/paperless/consume
    environment:
      COMPOSE_PROJECT_NAME: paperless
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu
      PAPERLESS_OCR_LANGUAGES: eng
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
      PAPERLESS_DATA_DIR: /usr/src/paperless/data
      PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
      PAPERLESS_URL: ${PAPERLESS_URL}
      # Redis
      PAPERLESS_REDIS: redis://broker:6379
      USERMAP_UID: 3001
      USERMAP_GID: 3007
      # DB access
      PAPERLESS_DB_OPTIONS: "sslmode=require"
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: ${DB_HOST}
      PAPERLESS_DBPORT: ${DB_PORT}
      PAPERLESS_DBNAME: ${DB_NAME}
      PAPERLESS_DBUSER: ${DB_USER}
      PAPERLESS_DBPASS: ${DB_PASS}
      # OAuth2/OpenID Connect
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: {"openid_connect":{"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"authentik","name":"authentik","client_id":"${SSO_CLIENT_ID}","secret":"${SSO_CLIENT_SECRET}","settings":{"server_url":"https://auth.home.sauers.link/application/o/paperless-ngx/.well-known/openid-configuration","fetch_userinfo":true}}],"SCOPE":["openid","profile","email"]}}
      PAPERLESS_LOGOUT_REDIRECT_URL: https://auth.home.sauers.link/application/o/paperless-ngx/end-session/
      PAPERLESS_SOCIAL_AUTO_SIGNUP: ${PAPERLESS_SOCIAL_AUTO_SIGNUP:-true}
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: true
    networks:
      - frontend
      - paperless-ngx
volumes:
  redisdata:
networks:
  frontend:
    external: true
  paperless-ngx:
