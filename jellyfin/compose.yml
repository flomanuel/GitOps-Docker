services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: 3001:3007
    group_add:
      - "991" # host group "render"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /opt/jellyfin/config:/config
      - /opt/jellyfin/cache:/cache
      - type: bind
        source: /mnt/media/audio/
        target: /audio
        read_only: true
      - type: bind
        source: /mnt/media/documents
        target: /documents
        read_only: true
      - type: bind
        source: /mnt/media/images
        target: /images
        read_only: true
      - type: bind
        source: /mnt/media/video
        target: /video
        read_only: true
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=https://streaming.home.sauers.link
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - frontend
      - jellyfin
    labels:
      # Backup
      - docker-volume-backup.stop-during-backup=true
      # Traefik
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.jellyfin.rule=Host(`streaming.debian-01.prod.home.sauers.link`) || Host(`streaming.home.sauers.link`)
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.routers.jellyfin.tls.certresolver=cloudflare
      # websecure: :443, streaming: :4444 (see traefik/compose.yml)
      - traefik.http.routers.jellyfin.entrypoints=websecure,streaming
      - traefik.http.routers.jellyfin.service=jellyfin
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096

networks:
  frontend:
    external: true
  jellyfin:
