services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: 3001:3007
    group_add:
      - "991" # host group "render"
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - /opt/jellyfin/config:/config
      - /opt/jellyfin/cache:/cache
      - type: bind
        source: /mnt/media/audio/
        target: /audio
        read_only: true
      - type: bind
        source: /mnt/media/documents
        target: /documents
        read_only: true
      - type: bind
        source: /mnt/media/images
        target: /images
        read_only: true
      - type: bind
        source: /mnt/media/video
        target: /video
        read_only: true
    restart: 'unless-stopped'
    environment:
      - JELLYFIN_PublishedServerUrl=https://streaming.home.sauers.link
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - frontend
      - jellyfin
    tags:
      # Backup
      - docker-volume-backup.stop-during-backup=true

networks:
  frontend:
    external: true
  jellyfin:
