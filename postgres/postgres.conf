listen_addresses = '*'
ssl = on
ssl_cert_file = '/etc/ssl/postgres/cert.pem'
ssl_key_file = '/etc/ssl/postgres/key.pem'

# JIT compile time dominates short OLTP queries with deep JOINs (e.g. authentik flows).
# See https://github.com/goauthentik/authentik/issues/24179
jit = off

# See https://www.postgresql.org/docs/current/runtime-config-wal.html
# See https://www.postgresql.org/docs/14/runtime-config-resource.html#GUC-SHARED-BUFFERS
max_wal_size = 2 GB
