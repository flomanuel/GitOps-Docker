# PostgreSQL + pgAdmin. https://hub.docker.com/_/postgres
# Deployed by Dockhand (git stack) on debian-01.
#
# Stack variables (in Dockhand):
#   PGADMIN_EMAIL                  pgAdmin login
#   POSTGRES_PASSWORD (secret)     superuser "postgres"; only read when pgdata is initialised
#   PGADMIN_PASSWORD (secret)      pgAdmin login; only read when pgAdmin's own DB is created
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # Default /dev/shm (64 MB) is too small for parallel queries.
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      # Absolute paths: data stays in the pre-Dockhand location.
      - /opt/postgres/pgdata:/var/lib/postgresql
      # Dump target (backup job reads dump-file from host folder "backup")
      - /opt/postgres/backup:/dump
    labels:
      # Run sql dump before backup jobs collects it.
      # Write tmp -> failed dump never overrides a good one
      - docker-volume-backup.archive-pre=/bin/sh -c 'pg_dumpall -U postgres > /dump/pg_dumpall.sql.tmp && mv /dump/pg_dumpall.sql.tmp /dump/pg_dumpall.sql'
      - traefik.enable=true
      - traefik.docker.network=frontend
      # Traefik answers the Postgres STARTTLS request and terminates TLS; clients need sslmode=require (or stricter).
      - traefik.tcp.routers.postgres.rule=HostSNI(`postgres.debian-01.data.home.sauers.link`)
      - traefik.tcp.routers.postgres.entrypoints=postgres
      - traefik.tcp.routers.postgres.tls=true
      - traefik.tcp.routers.postgres.tls.certresolver=cloudflare
      - traefik.tcp.services.postgres.loadbalancer.server.port=5432
    networks:
      - postgres
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin runs as uid 5050; a fresh bind mount would be root-owned.
  pgadmin-init:
    image: busybox:1.37
    command: chown -R 5050:5050 /var/lib/pgadmin
    volumes:
      - /opt/postgres/pgadmin:/var/lib/pgadmin
    restart: "no"
    network_mode: none

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?}
    volumes:
      - /opt/postgres/pgadmin:/var/lib/pgadmin
      # Imported on first start only (when pgAdmin's own DB is created).
      - ./servers.json:/pgadmin4/servers.json:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=frontend
      - traefik.http.routers.pgadmin.rule=Host(`postgres.debian-01.mgmt.home.sauers.link`)
      - traefik.http.routers.pgadmin.tls=true
      - traefik.http.routers.pgadmin.tls.certresolver=cloudflare
      - traefik.http.routers.pgadmin.entrypoints=mgmt
    networks:
      - postgres
      - frontend
    depends_on:
      pgadmin-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

networks:
  postgres:
    external: true
  frontend:
    external: true
