# Traefik reverse proxy, one instance per docker host. Deployed by Dockhand (git stack).
# - Entrypoints are bound per VLAN, so a router picks its network via `entrypoints=`:
#     web/websecure  -> PROD and DATA addresses (:80/:443)
#     mgmt           -> MGMT address (:443 on the host, :8443 in the container)
# - The shared "frontend" network is created by Ansible (docker_networks), not by this stack.
#
# Stack variables (per environment, in Dockhand):
#   PROD_IP, DATA_IP, MGMT_IP     host addresses to bind to
#   CF_DNS_API_TOKEN (secret)     Cloudflare Zone:DNS:Edit, ACME DNS challenge
services:
  traefik:
    image: traefik:v3.7
    container_name: traefik-1
    networks:
      - frontend
    ports:
      - "${PROD_IP:?}:80:80"
      - "${PROD_IP:?}:443:443"
      - "${DATA_IP:?}:80:80"
      - "${DATA_IP:?}:443:443"
      - "${MGMT_IP:?}:80:80"
      - "${MGMT_IP:?}:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      # Absolute path: ACME certs stay in the pre-Dockhand location (backed up by the backup stack).
      - /opt/traefik/data/certs/:/var/traefik/certs/:rw
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?}
    restart: unless-stopped
    labels:
      # Backup
      - docker-volume-backup.stop-during-backup=true

networks:
  frontend:
    external: true
