# Hermes (Nous Research) agent + web UI, running on VM vm09 (10.50.0.19, prod VLAN).
# Only loaded by Traefik on debian-01 (TRAEFIK_HOST) — agent.home.sauers.link is a CNAME to debian-01.
#
# Defined via the file provider because hermes runs on a different host, so it
# cannot use docker labels. The web UI serves HTTPS on 443 with a self-signed
# certificate, so the backend skips certificate verification
# (insecureSkipVerify): the internal hop is still TLS-encrypted end to end,
# the cert is just not authenticated. Fine on the trusted prod VLAN.
http:
  routers:
    hermes:
      rule: "Host(`hermes.home.sauers.link`)"
      entryPoints:
        - websecure
      service: hermes
      tls:
        certResolver: cloudflare

  services:
    hermes:
      loadBalancer:
        serversTransport: selfsigned-backend
        servers:
          - url: "https://10.50.0.19:443"

  serversTransports:
    # For backends whose TLS certificate traefik cannot verify (self-signed).
    selfsigned-backend:
      insecureSkipVerify: true
