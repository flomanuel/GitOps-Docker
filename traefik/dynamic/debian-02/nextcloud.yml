# Nextcloud AIO (stack: nextcloud/), only loaded by Traefik on debian-02 (TRAEFIK_HOST)
# Defined via file provider because the apache container is created by the AIO mastercontainer and cannot carry labels.
# See https://github.com/nextcloud/all-in-one/blob/main/reverse-proxy.md#traefik-3
http:
  routers:
    nextcloud:
      rule: "Host(`cloud.home.sauers.link`)"
      entryPoints:
        - websecure
      service: nextcloud
      middlewares:
        - nextcloud-chain
      tls:
        certResolver: cloudflare

    # HaRP exposes the Docker API (via the mounted docker.sock) under /exapps/app_api/, protected only by the shared key.
    # Nextcloud talks to HaRP directly on the nextcloud-aio network (nextcloud-aio-harp:8780), so block it from outside.
    # ExApp UIs under /exapps/<appid>/ stay reachable.
    nextcloud-harp-docker-api-deny:
      rule: "Host(`cloud.home.sauers.link`) && PathPrefix(`/exapps/app_api`)"
      priority: 1000
      entryPoints:
        - websecure
      service: nextcloud
      middlewares:
        - deny-all
      tls:
        certResolver: cloudflare

  services:
    nextcloud:
      loadBalancer:
        servers:
          # Reachable via the "frontend" network (APACHE_ADDITIONAL_NETWORK). Port must match APACHE_PORT.
          - url: "http://127.0.0.1:11000"

  middlewares:
    nextcloud-secure-headers:
      headers:
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        referrerPolicy: "same-origin"
        customRequestHeaders:
          X-Forwarded-Proto: "https"

    # Traefik has no deny middleware; an allow list that no client can match returns 403.
    # No ipStrategy on purpose, so the check uses the TCP peer address and X-Forwarded-For cannot bypass it.
    deny-all:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"

    https-redirect:
      redirectScheme:
        scheme: https

    nextcloud-chain:
      chain:
        middlewares:
          - https-redirect
          - nextcloud-secure-headers
